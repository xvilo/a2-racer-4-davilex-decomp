[package]
name = "a2racer4"
version = "0.29.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["pkg-config"]
# SDL2 found through pkg-config (development builds against the system's SDL2).
pkg-config = ["sdl2-sys/use-pkgconfig"]
# SDL2 built from source and linked in (the release builds: one executable).
static = ["sdl2-sys/bundled", "sdl2-sys/static-link"]

[dependencies]
sdl2-sys = "0.38"
stb_truetype = "0.3.1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
debug = "line-tables-only"
