name: build

on:
  push:
    branches: ['**']
    # A version tag builds the port and attaches the builds to the tag's release.
    tags: ['v*']
  pull_request:
  # A release made on GitHub (with a new tag, or a draft published later).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Build this tag and attach the builds to its release (empty for an ordinary build)
        required: false
        default: ''

# The port is C++ (port/CMakeLists.txt). Release builds carry SDL2 inside, built from
# source as a static library (tools/build_static_sdl.sh), so the executables need nothing
# beyond the system (on Linux SDL opens X11/Wayland, the sound server and OpenGL at run
# time).

# Runs for the same tag (its push, its release, one started by hand) wait for each other.
concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Dependencies (SDL's video, sound and input back ends)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - name: SDL2, static
        run: tools/build_static_sdl.sh deps -G Ninja
      - name: Build
        run: |
          cmake -S port -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/deps
          cmake --build port/build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        run: grep -E "error|undefined reference|multiple definition" build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          ldd port/build/a2racer4
          if ldd port/build/a2racer4 | grep -iE "sdl"; then echo "::error::links SDL dynamically"; exit 1; fi
          mkdir -p dist/a2racer4
          cp port/build/a2racer4 port/README.md dist/a2racer4/
          tar -C dist -czf a2racer4-linux-x86_64.tar.gz a2racer4
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer4-linux-x86_64
          path: a2racer4-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: SDL2, static and universal
        run: tools/build_static_sdl.sh deps "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build (Apple Silicon and Intel in one)
        run: |
          cmake -S port -B port/build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_PREFIX_PATH=$PWD/deps
          cmake --build port/build -j 4 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        run: grep -E "error|Undefined" build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          otool -L port/build/a2racer4
          if otool -L port/build/a2racer4 | grep -E "SDL|/opt/homebrew|/usr/local"; then echo "::error::links a non-system library"; exit 1; fi
          lipo -info port/build/a2racer4
          mkdir -p dist/a2racer4
          cp port/build/a2racer4 port/README.md dist/a2racer4/
          codesign --force --sign - dist/a2racer4/a2racer4
          (cd dist && zip -r ../a2racer4-macos-universal.zip a2racer4)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer4-macos-universal
          path: a2racer4-macos-universal.zip

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: SDL2, static (with the static C runtime)
        run: tools/build_static_sdl.sh deps
      - name: Build
        run: |
          cmake -S port -B port/build -DCMAKE_PREFIX_PATH=$PWD/deps
          cmake --build port/build --config Release 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Report compiler errors
        if: failure()
        run: grep -E "error|unresolved" build.log | head -40 | sed 's/^/::error::/' || true
      - name: Package
        run: |
          mkdir -p dist/a2racer4
          cp port/build/Release/a2racer4.exe port/README.md dist/a2racer4/
          (cd dist && 7z a -tzip ../a2racer4-windows-x86_64.zip a2racer4)
      - uses: actions/upload-artifact@v4
        with:
          name: a2racer4-windows-x86_64
          path: a2racer4-windows-x86_64.zip

  # Every push to main replaces the "latest" pre-release with these builds, so they can
  # be downloaded without a GitHub account. A version tag (pushed, made with a release,
  # or given to a run started by hand) gets its builds attached to its own release.
  # Older tags may not build everywhere (v0.4.0-v0.7.0 don't compile on Windows): their
  # releases get the builds that did succeed.
  release:
    if: >-
      !cancelled() && needs.linux.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the builds to the tag's release
        if: env.TAG != ''
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Publish the latest build
        if: env.TAG == ''
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Automatic build of the port from ${GITHUB_SHA::7}. The game's data is not included: run it with --data pointing at the original A2 Racer 4 CD image (.bin/.iso) or a copy of its files, or put it next to the CD image. See README.md in each archive."
      # Version tags whose releases have no builds: the builds from the run that built the
      # tag's commit on main, or, without one, a build of the tag started now.
      - name: Attach builds to earlier version tags without them
        if: env.TAG == ''
        run: |
          for tag in $(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' | grep '^v' || true); do
            assets=$(gh release view "$tag" --json assets --jq '.assets | length' 2> /dev/null || echo none)
            [ "$assets" = 0 ] || [ "$assets" = none ] || continue
            sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            run=$(gh run list --workflow build.yml --commit "$sha" --status completed --limit 20 \
              --json databaseId,event --jq '[.[] | select(.event == "push")][0].databaseId // empty')
            rm -rf "backfill/$tag"
            if [ -z "$run" ] || ! gh run download "$run" -D "backfill/$tag"; then
              echo "$tag: no builds of $sha to reuse, starting a build of the tag"
              gh workflow run build.yml --ref main -f tag="$tag"
              continue
            fi
            files=$(find "backfill/$tag" -type f \( -name '*.zip' -o -name '*.tar.gz' \))
            if [ -z "$files" ]; then
              echo "$tag: run $run has no builds, starting a build of the tag"
              gh workflow run build.yml --ref main -f tag="$tag"
              continue
            fi
            echo "$tag: attaching" $files "from run $run"
            if [ "$assets" = none ]; then
              gh release create "$tag" $files --verify-tag --title "$tag" --generate-notes
            else
              gh release upload "$tag" $files --clobber
            fi
          done
